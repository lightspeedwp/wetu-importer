# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 18.x and 20.x are EOL; 22.x (Maintenance LTS) and 24.x (Active LTS)
        # are the two currently-supported lines. See
        # https://nodejs.org/en/about/previous-releases for current status.
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    # package.json has no real test suite (its "test" script is npm's
    # placeholder, which exits 1 unconditionally); validate-collections.js is
    # this repo's actual meaningful check.
    - run: npm run validate
